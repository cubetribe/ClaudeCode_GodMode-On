# Release Tail Automation (v8.5, ADR-004)
# Closes the structural hole that produced the v7.1.1/v8.0.1 phantom releases:
# when a release PR merges to main with a new VERSION, this job creates the
# annotated tag and a DRAFT GitHub Release from the CHANGELOG section.
# The maintainer reviews and publishes the draft manually — no unattended
# publishing, in keeping with the repo's "never push without permission" law.
name: Release Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create annotated tag + draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file is not valid semver: '$VERSION'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "CC_GodMode v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          # Release notes = the CHANGELOG section for this version
          awk "/^## \[$VERSION\]/{flag=1;next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/notes.md
          gh release create "v$VERSION" --draft --title "v$VERSION" --notes-file /tmp/notes.md
          echo "Created tag v$VERSION and draft release — publish it manually."

      - name: Verify release invariant (tags only, offline mode)
        run: node scripts/release-check.js --ci
